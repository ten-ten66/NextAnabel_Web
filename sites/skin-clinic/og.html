<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>白磁スキンクリニック OGP</title>
<!-- tools/og-image.mjs が 1200×630 で撮影して assets/img/ogp.png に保存する -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500&amp;family=Zen+Kaku+Gothic+New:wght@400;700&amp;display=swap">
<style>
  :root {
    --color-porcelain: #F7F8F6;
    --color-paper: #FFFFFF;
    --color-line: #C9D2D6;
    --color-ink: #26323A;
    --color-ink-soft: #56646C;
    --color-cobalt: #2B4C8C;
    --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--color-porcelain); color: var(--color-ink); }
  body { position: relative; font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  .glaze { position: absolute; inset: 0; background: url("assets/img/hero-glaze.webp") 70% 50% / cover no-repeat; }
  .frame { position: absolute; inset: 28px; border: 1px solid var(--color-line); }
  .intro { position: absolute; left: 88px; bottom: 92px; }
  .mark { display: flex; align-items: center; gap: 16px; }
  .mark svg { width: 52px; height: 52px; }
  .en { font-size: 14px; letter-spacing: 0.36em; color: var(--color-ink-soft); }
  .name { margin-top: 18px; font-family: var(--font-display); font-weight: 500; font-size: 54px; letter-spacing: 0.16em; line-height: 1.3; }
  .lead { margin-top: 18px; font-size: 21px; line-height: 1.8; letter-spacing: 0.06em; color: var(--color-ink); }
  .meta { display: flex; gap: 14px; margin-top: 22px; font-size: 15px; color: var(--color-ink-soft); letter-spacing: 0.08em; }
  .meta span + span::before { content: "／"; margin-right: 14px; color: var(--color-line); }
  .lockup { position: absolute; top: 60px; right: 104px; display: flex; flex-direction: row-reverse; align-items: flex-end; }
  .catch { writing-mode: vertical-rl; font-family: var(--font-display); font-weight: 500; font-size: 56px; line-height: 1.7; letter-spacing: 0.14em; color: var(--color-ink); }
  .seal { display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 4px; border-radius: 3px; background: var(--color-cobalt); color: var(--color-paper); font-family: var(--font-display); font-size: 15px; line-height: 1.05; writing-mode: vertical-rl; }
  .sample { position: absolute; top: 56px; left: 88px; padding: 4px 12px; border: 1px solid var(--color-cobalt); color: var(--color-cobalt); font-size: 14px; font-weight: 700; letter-spacing: 0.12em; background: var(--color-paper); }
</style>
</head>
<body>
  <div class="glaze"></div>
  <div class="frame"></div>
  <p class="sample">架空のサンプルサイト</p>
  <div class="intro">
    <div class="mark">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18.5" fill="#FFFFFF" stroke="#C9D2D6"/>
        <circle cx="20" cy="20" r="10.5" fill="none" stroke="#2B4C8C" stroke-width="1.3"/>
        <path d="M15.6 22.4c1.5 2.1 4.6 2.9 7.2 1.6" fill="none" stroke="#2B4C8C" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="20" cy="17.6" r="1.6" fill="#2B4C8C"/>
      </svg>
      <p class="en">HAKUJI SKIN CLINIC</p>
    </div>
    <p class="name">白磁スキンクリニック</p>
    <p class="lead">費用の総額・回数の目安・リスクを、<br>施術の前にすべてご説明します。</p>
    <p class="meta"><span>南青山の美容皮膚科</span><span>表参道駅から徒歩4分</span></p>
  </div>
  <div class="lockup">
    <p class="catch">納得してから、<br>はじめる肌治療。</p>
    <span class="seal">白磁</span>
  </div>
</body>
</html>
