<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&amp;family=Zen+Kaku+Gothic+Antique:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&amp;text=kotesaSmplwrk%C2%B7&amp;display=swap">
<style>
  /* tools/og-image.mjs で 1200×630 の PNG に書き出す（色は tokens/esthetic.tokens.json） */
  :root {
    --color-linen: #ECEEE6;
    --color-paper: #F6F7F2;
    --color-lichen: #A8B394;
    --color-moss: #2F3B2B;
    --color-moss-soft: #56664F;
    --color-mauve: #7E6278;
    --color-mauve-soft: #DCCFD8;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background-color: var(--color-linen);
    color: var(--color-moss);
    font-family: "Zen Kaku Gothic Antique", sans-serif;
  }

  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 76px 84px 64px;
    isolation: isolate;
    display: grid;
    align-content: space-between;
  }

  /* 枝の影（ぼかし）と線画の2層。PNG の容量を抑えるため、写真の質感は使わない */
  .og__branch {
    position: absolute;
    top: -70px;
    right: -30px;
    width: 470px;
    z-index: -1;
  }

  .og__branch--shade {
    top: -36px;
    right: -64px;
    z-index: -2;
    opacity: .16;
    filter: blur(6px);
  }

  .og__branch svg { display: block; width: 100%; height: auto; overflow: visible; }
  .p-hero__stem { fill: none; stroke: var(--color-moss-soft); stroke-width: 1.4; stroke-linecap: round; }
  .p-hero__leaf-outline { fill: rgba(168, 179, 148, .3); stroke: var(--color-moss-soft); stroke-width: 1.2; stroke-linejoin: round; }
  .p-hero__leaf-rib { fill: none; stroke: var(--color-moss-soft); stroke-width: 1; stroke-linecap: round; }
  .p-hero__shade { fill: var(--color-moss); }
  .p-hero__shade-stem { fill: none; stroke: var(--color-moss); stroke-width: 4; }

  .og__eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: .14em;
    color: var(--color-moss-soft);
  }

  .og__eyebrow::before { content: ""; width: 34px; height: 1px; background: currentColor; }

  .og__name {
    margin: 26px 0 0;
    font-family: "Klee One", serif;
    font-weight: 600;
    font-size: 172px;
    line-height: 1.04;
    letter-spacing: .06em;
  }

  .og__en {
    margin: 10px 0 0;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-size: 50px;
    line-height: 1.1;
    color: var(--color-mauve);
  }

  .og__swash { width: 260px; margin-top: 10px; }
  .og__swash path { fill: none; stroke: var(--color-lichen); stroke-width: 2.4; stroke-linecap: round; }

  .og__catch {
    position: absolute;
    top: 96px;
    right: 336px;
    margin: 0;
    writing-mode: vertical-rl;
    font-family: "Klee One", serif;
    font-size: 40px;
    line-height: 1.5;
    letter-spacing: .3em;
  }

  .og__catch span { display: block; }
  .og__catch span + span { margin-block-start: .35em; padding-inline-start: 1.8em; }

  .og__foot {
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 22px;
    letter-spacing: .08em;
  }

  .og__tag {
    padding: 6px 18px;
    border-radius: 999px;
    background: var(--color-mauve-soft);
    color: var(--color-moss);
    font-size: 18px;
    letter-spacing: .06em;
  }
</style>
</head>
