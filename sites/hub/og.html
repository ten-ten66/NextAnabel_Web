<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f3f4f6; color: #15181b; font-family: "Murecho", sans-serif; display: grid; grid-template-columns: 1fr 420px; overflow: hidden; }
  .text { padding: 84px 0 72px 84px; display: grid; align-content: space-between; }
  .label { font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: .14em; color: #5a626a; text-transform: uppercase; }
  h1 { margin: 0; font-size: 76px; line-height: 1.22; letter-spacing: .01em; font-weight: 700; }
  p { margin: 0; font-size: 26px; color: #3f474e; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 84px 84px 84px 0; }
  .tiles span { border-radius: 14px; display: grid; align-content: end; padding: 18px; font-size: 20px; font-weight: 700; color: #fff; }
  .t1 { background: linear-gradient(160deg, #f7f8f6, #dce3e6); color: #2b4c8c !important; border: 2px solid #c9d2d6; }
  .t2 { background: linear-gradient(160deg, #2a3038, #111418); color: #ede7dc !important; }
  .t3 { background: linear-gradient(160deg, #eceee6, #a8b394); color: #2f3b2b !important; }
  .t4 { background: linear-gradient(160deg, #2f5bd3, #1a367f); }
</style>
</head>
<body>
  <div class="text">
    <div class="label">Sample works</div>
    <h1>美容・医療<br>Webサイト<br>サンプル集</h1>
    <p>美容皮膚科・美容外科・エステ・医療脱毛LP（架空）</p>
  </div>
  <div class="tiles">
    <span class="t1">美容皮膚科</span>
    <span class="t2">美容外科</span>
    <span class="t3">エステ</span>
    <span class="t4">医療脱毛LP</span>
  </div>
</body>
</html>
